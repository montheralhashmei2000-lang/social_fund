version: '3.8'

services:
  server:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      PORT: 8000
      DATA_DIR: /data
      ASSETS_DIR: /app/assets
    volumes:
      - ./data:/data
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_DB: socialfund
      POSTGRES_USER: socialfund
      POSTGRES_PASSWORD: socialfund
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: