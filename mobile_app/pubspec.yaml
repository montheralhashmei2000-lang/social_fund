name: social_fund_app
description: الصندوق الاجتماعي التنموي - نظام إدارة أونلاين بالكامل (Flutter/Dart).
publish_to: 'none'
version: 9.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # الشبكة والجلسات - دعم محلي-أول (Local-First) مع مزامنة مؤجلة
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.0
  sqlite3_flutter_libs: ^0.5.37
  path: ^1.9.0

  # مصادقة بيومترية حقيقية (بصمة/قفل الجهاز)
  local_auth: ^2.2.0

  # الإشعارات الفورية
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # فحص الاتصال بالخادم - التطبيق أونلاين فقط
  connectivity_plus: ^6.0.5

  # واجهة
  intl: ^0.20.3
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800